name: Sincronizar Concursos & Atualizar Firebase Hosting

on:
  push:
    branches:
      - main
  schedule:
    # Executa exatamente a cada 72 horas (às 06:00 UTC / 03:00 Horário de Brasília)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Permite acionar manualmente a qualquer momento pelo painel do GitHub

jobs:
  sync_and_deploy:
    name: Sincronizar RSS e Deploy Hosting
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Instalar Dependências
        run: npm ci || npm install

      - name: 4. Ingerir RSS Multiffontes, Atualizar /concursos e sitemap.xml
        run: npm run sync-news

      - name: 5. Deploy no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEU_CICLO_450C9 }}'
          channelId: live
          projectId: meu-ciclo-450c9
